packages:
  - "shared"

packageExtensions:
  "@kingstinct/react-native-healthkit@13":
    dependencies:
      "@expo/config-plugins": "^55.0.0"
  # uniwind's metro plugin does `require("metro/private/DeltaBundler/Graph")` and
  # `require("metro-cache/private/stores/FileStore")` but doesn't declare those as deps.
  # Inject them so pnpm puts them in uniwind's resolution scope.
  "uniwind":
    dependencies:
      "metro": "*"
      "metro-cache": "*"

# pnpm truncates directory names in node_modules/.pnpm to a per-OS default:
# 120 on Linux/macOS, 60 on Windows. The expo-updates fingerprint hashes those
# paths, so a Windows machine and an EAS Build worker computed different runtime
# versions from identical dependencies. Pinning the shorter value makes both
# produce the same names; 60 rather than 120 because Windows is the side with
# the MAX_PATH limit that the lower default exists to avoid.
virtualStoreDirMaxLength: 60

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@scarf/scarf"
  - "@shopify/react-native-skia"
  - esbuild
  - unrs-resolver

minimumReleaseAge: 4320

minimumReleaseAgeExclude: []

patchedDependencies:
  "react-native-health-connect@3.5.3": "patches/react-native-health-connect@3.5.3.patch"
  "@bacons/apple-targets@4.0.6": "patches/@bacons__apple-targets@4.0.6.patch"
  "expo-maps@57.0.2": "patches/expo-maps.patch"
